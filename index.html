<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
</head>
<body>
<title>하얀 버튼</title>
<!-- One self-contained file on purpose: it has to travel to a phone as a single page. -->
<style>
  /* Paper-white full-bleed canvas. Everything is drawn; nothing is written. */
  :root { --paper: #ffffff; color-scheme: light; }
  html, body { height: 100%; margin: 0; background: var(--paper); overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--paper); }
</style>
<canvas id="stage"></canvas>
<script>
(() => {
  'use strict';

  // ---------- tuning ----------
  const TAU = Math.PI * 2;
  const ERA_LENGTH = 22;              // interaction points needed to finish one era
  const MAX_ENTITIES = 32;
  const MAX_PARTICLES = 380;
  const TAP_MAX_MOVE = 14;
  const TAP_MAX_MS = 450;
  const SHAKE_REVERSALS = 4;
  const SHAKE_WINDOW_MS = 800;
  const SHAKE_COOLDOWN_MS = 450;
  const DEVICE_SHAKE_ACCEL = 16;
  const DEVICE_SHAKE_COOLDOWN_MS = 800;
  const BUTTON_R = 36;
  const FINALE_BUTTON_R = 70;
  const BPM = 124;
  const OUTLINE = '#2b2226';
  const TRANSITIONS = [
    { dur: 2.6, convertAt: 0.6 },
    { dur: 2.2, convertAt: 0.55 },
    { dur: 2.0, convertAt: 0.55 },
  ];
  const FINALE = { dance: 3.4, vacuum: 5.4, end: 6.2 };
  // eras: 0 scary, 1 cute, 2 grotesque, 3 funny; each era unlocks kinds in three stages
  const SPAWN_STAGES = [
    [['eye'], ['eye', 'shade'], ['shade', 'hand', 'eye']],
    [['mochi'], ['mochi', 'egg'], ['mochi', 'egg', 'ghostie']],
    [['flesh'], ['flesh', 'worm'], ['worm', 'lipflower', 'flesh']],
    [['groucho'], ['groucho', 'chicken'], ['chicken', 'banana', 'cushion', 'groucho']],
  ];
  const MORPH = {
    eye: 'mochi', shade: 'ghostie', hand: 'egg',
    mochi: 'flesh', egg: 'lipflower', chick: 'worm', ghostie: 'flesh',
    flesh: 'groucho', worm: 'banana', lipflower: 'chicken',
  };
  const BG = [[255, 255, 255], [255, 246, 250], [247, 246, 236], [255, 255, 255]];
  const PASTELS = ['#ffc8dd', '#c8f1dc', '#ddd2ff', '#fff0b3', '#c9e6ff'];
  const CONFETTI = ['#ff4d6d', '#ffd23f', '#3ec1d3', '#7bd389', '#a36bff', '#ff9f1c'];
  const IRISES = ['#3b6e8f', '#5a3d1e', '#4f7a3a', '#7a1c1c', '#2a2a2a', '#8a6d1d'];
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- small utilities ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeOutBack = t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);
  const lerpAngle = (a, b, t) => a + ((((b - a + Math.PI) % TAU) + TAU) % TAU - Math.PI) * Math.min(1, t);
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mixHex = (a, b, t) => {
    const pa = hexRgb(a), pb = hexRgb(b);
    return `rgb(${pa.map((v, i) => Math.round(lerp(v, pb[i], t))).join(',')})`;
  };

  // ---------- canvas ----------
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---------- state ----------
  const game = {
    era: 0, progress: 0, time: 0, started: false,
    entities: [], particles: [],
    transition: null, finale: null,
    pointer: { x: -1, y: -1 },
    bg: [255, 255, 255],
    quake: 0, dark: 0, flicker: 0, flickPos: { x: 0, y: 0 }, peek: null,
    inflate: 0, bop: 0, beatTimer: 0, beatCount: 0, heartTimer: 1,
  };
  const button = { x: 0, y: 0, r: BUTTON_R, press: 0, home: 0 };
  const drags = new Map();
  const eraT = () => clamp(game.progress / ERA_LENGTH, 0, 1);

  // ---------- sound (all synthesized) ----------
  const audio = {
    ctx: null, out: null, noise: null, drone: null,
    get ready() { return !!this.ctx && this.ctx.state === 'running'; },
    unlock() {
      if (!this.ctx) this.init();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => { /* retried on next touch */ });
    },
    init() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const c = new AC();
      this.ctx = c;
      this.out = c.createGain(); this.out.gain.value = 0.55;
      const comp = c.createDynamicsCompressor();
      this.out.connect(comp); comp.connect(c.destination);
      const buf = c.createBuffer(1, c.sampleRate, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
      const g = c.createGain(), f = c.createBiquadFilter();
      g.gain.value = 0; f.type = 'lowpass'; f.frequency.value = 260;
      [55, 55.7, 82.4].forEach(fr => { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.connect(f); o.start(); });
      f.connect(g); g.connect(this.out);
      this.drone = g;
    },
    setDrone(v) { if (this.drone) this.drone.gain.setTargetAtTime(v, this.ctx.currentTime, 0.4); },
    tone(freq, dur, o = {}) {
      if (!this.ready) return;
      const c = this.ctx, t = c.currentTime + (o.delay || 0);
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.toAt || dur));
      if (o.vib) {
        const l = c.createOscillator(), lg = c.createGain();
        l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1];
        l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.05);
      }
      const vol = o.vol ?? 0.2;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + (o.attack || 0.008));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      let node = osc;
      if (o.bp || o.lp) {
        const f = c.createBiquadFilter();
        f.type = o.bp ? 'bandpass' : 'lowpass'; f.frequency.value = o.bp || o.lp; f.Q.value = o.q || 1;
        osc.connect(f); node = f;
      }
      node.connect(g); g.connect(this.out);
      osc.start(t); osc.stop(t + dur + 0.05);
    },
    hiss(dur, o = {}) {
      if (!this.ready) return;
      const c = this.ctx, t = c.currentTime + (o.delay || 0);
      const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      src.buffer = this.noise;
      f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t); f.Q.value = o.q ?? 1;
      if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol ?? 0.2, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(this.out);
      src.start(t, Math.random() * 0.4); src.stop(t + dur + 0.05);
    },
  };

  const sfx = {
    click: () => { audio.hiss(0.06, { f: 1800, vol: 0.25 }); audio.tone(90, 0.12, { vol: 0.3 }); },
    blink: () => audio.tone(1400, 0.04, { vol: 0.05, type: 'triangle' }),
    thump: (v = 0.35) => audio.tone(60, 0.18, { to: 40, vol: v }),
    heartbeat: v => { sfx.thump(v); audio.tone(55, 0.16, { to: 38, vol: v * 0.8, delay: 0.18 }); },
    stinger: (v = 0.25) => {
      audio.hiss(0.5, { f: 1400, q: 0.7, vol: v, to: 300 });
      [311, 330, 370, 392].forEach(f => audio.tone(f, 0.9, { type: 'sawtooth', vol: v * 0.25, lp: 1800, vib: [7, 6] }));
    },
    whoosh: () => audio.hiss(0.4, { f: 400, to: 2400, vol: 0.12, q: 0.6 }),
    boop: () => audio.tone(520, 0.14, { to: 880, vol: 0.22 }),
    pop: () => audio.tone(380, 0.09, { to: 1300, vol: 0.2 }),
    giggle: () => { for (let i = 0; i < 5; i++) audio.tone(rand(800, 1150) + i * 60, 0.07, { vol: 0.12, delay: i * 0.075, type: 'triangle' }); },
    cheep: () => { audio.tone(2300, 0.08, { to: 3100, vol: 0.1 }); audio.tone(2400, 0.09, { to: 3300, vol: 0.1, delay: 0.12 }); },
    crack: () => audio.hiss(0.07, { type: 'highpass', f: 2500, vol: 0.25 }),
    boo: () => audio.tone(330, 0.5, { to: 520, toAt: 0.25, vol: 0.15, vib: [6, 10] }),
    twinkle: () => audio.tone(pick([1318, 1568, 1760, 2093]), 0.3, { vol: 0.05, type: 'triangle' }),
    squelch: () => { audio.hiss(0.3, { type: 'lowpass', f: 1600, to: 180, vol: 0.35 }); audio.tone(140, 0.25, { to: 55, vol: 0.25, type: 'triangle' }); },
    chatter: () => { for (let i = 0; i < 7; i++) audio.hiss(0.03, { f: 3200, q: 4, vol: 0.25, delay: i * 0.045 }); },
    musicbox: () => audio.tone(pick([523, 587, 659, 784, 880]) * pick([1, 0.97, 1.04]), 0.9, { vol: 0.06, type: 'triangle', vib: [4, 8] }),
    honk: () => {
      audio.tone(250, 0.28, { to: 225, type: 'sawtooth', bp: 800, q: 3, vol: 0.5 });
      audio.tone(256, 0.28, { to: 230, type: 'square', bp: 1100, q: 3, vol: 0.3 });
    },
    squawk: (delay = 0) => audio.tone(700, 0.42, { to: 1500, toAt: 0.12, type: 'sawtooth', bp: 1400, q: 2.5, vol: 0.35, vib: [28, 90], delay }),
    squeak: () => audio.tone(1500, 0.18, { to: 2300, vol: 0.15 }),
    fart: (delay = 0) => audio.tone(95, 0.6, { to: 60, type: 'sawtooth', lp: 500, vol: 0.5, vib: [23, 30], delay }),
    slideUp: () => audio.tone(400, 0.5, { to: 1800, vol: 0.18 }),
    slideDown: () => audio.tone(1800, 0.8, { to: 200, vol: 0.18 }),
    boing: () => audio.tone(180, 0.45, { to: 420, type: 'triangle', vol: 0.3, vib: [18, 60] }),
    kazoo: (n, delay = 0) => audio.tone(n, 0.2, { type: 'sawtooth', bp: 1300, q: 1.5, vol: 0.18, vib: [6, 8], delay }),
    kick: () => audio.tone(120, 0.15, { to: 45, vol: 0.35 }),
    bass: f => audio.tone(f, 0.18, { type: 'triangle', vol: 0.22 }),
  };
  const PRESS_SOUNDS = [sfx.click, sfx.boop, sfx.squelch, sfx.honk];

  // ---------- drawing helpers ----------
  function ellipse(x, y, rx, ry, fill, stroke, lw = 2.5) {
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(0.1, Math.abs(rx)), Math.max(0.1, Math.abs(ry)), 0, 0, TAU);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function line(points, stroke, lw) {
    ctx.beginPath(); ctx.moveTo(points[0], points[1]);
    for (let i = 2; i < points.length; i += 2) ctx.lineTo(points[i], points[i + 1]);
    ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke();
  }
  // unit-ish vector in the entity's local frame pointing at the last touch
  function lookDir(x, y, rot) {
    const has = game.pointer.x >= 0;
    const dx = (has ? game.pointer.x : button.x) - x, dy = (has ? game.pointer.y : button.y) - y;
    const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 80);
    const c = Math.cos(-rot), s = Math.sin(-rot);
    return { x: ((dx * c - dy * s) / d) * k, y: ((dx * s + dy * c) / d) * k };
  }
  function tickBlink(s, dt, minGap = 1.5, maxGap = 5) {
    s.nextBlink = (s.nextBlink ?? rand(minGap, maxGap)) - dt;
    if (s.nextBlink < 0) { s.blinkT = 0.18; s.nextBlink = rand(minGap, maxGap); }
    if (s.blinkT > 0) { s.blinkT -= dt; s.blink = Math.sin(clamp(1 - s.blinkT / 0.18, 0, 1) * Math.PI); }
    else s.blink = 0;
  }
  function drawEyeball(x, y, r, look, o = {}) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1, Math.max(0.06, 1 - (o.blink || 0)));
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#ead9d3');
    ellipse(0, 0, r, r, g);
    if (o.veins) {
      ctx.strokeStyle = 'rgba(175,25,35,0.55)'; ctx.lineWidth = Math.max(0.6, r * 0.035);
      for (let i = 0; i < o.veins; i++) {
        const a = (o.seed || 0) * 50 + i * 2.39;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        ctx.quadraticCurveTo(Math.cos(a + 0.35) * r * 0.75, Math.sin(a + 0.35) * r * 0.75, Math.cos(a - 0.1) * r * 0.52, Math.sin(a - 0.1) * r * 0.52);
        ctx.stroke();
      }
    }
    const ix = look.x * r * 0.38, iy = look.y * r * 0.38, dil = o.dilate || 1;
    ellipse(ix, iy, r * 0.44, r * 0.44, o.iris || '#4a0d0d');
    ellipse(ix, iy, r * 0.2 * dil, r * 0.2 * dil, '#0b0606');
    ellipse(ix - r * 0.14, iy - r * 0.16, r * 0.09, r * 0.09, 'rgba(255,255,255,0.9)');
    ellipse(0, 0, r, r, null, OUTLINE, Math.max(1.4, r * 0.07));
    ctx.restore();
  }
  function drawCuteFace(r, cx, cy, s, o = {}) {
    const ex = r * (o.spread ?? 0.32), es = r * (o.eye ?? 0.08), lw = Math.max(1.6, r * 0.07);
    ctx.lineCap = 'round';
    for (const side of [-1, 1]) {
      const x = cx + side * ex;
      ctx.strokeStyle = OUTLINE; ctx.lineWidth = lw;
      if (s.dizzy > 0) {
        ctx.beginPath();
        for (let a = 0; a < TAU * 2; a += 0.4) {
          const rr = (es * 1.4 * a) / (TAU * 2), aa = a + game.time * 9 * side;
          const px = x + Math.cos(aa) * rr, py = cy + Math.sin(aa) * rr;
          if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.lineWidth = Math.max(1.2, r * 0.04); ctx.stroke();
      } else if (s.happy > 0) {
        ctx.beginPath(); ctx.arc(x, cy + es * 0.5, es, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      } else {
        const open = Math.max(0.12, 1 - (s.blink || 0));
        ellipse(x, cy, es * 0.8, es * open, OUTLINE);
        if (open > 0.5) ellipse(x - es * 0.25, cy - es * 0.4, es * 0.25, es * 0.25, '#ffffff');
      }
      ellipse(x + side * es * 0.6, cy + es * 2.1, es * 1.7, es * 0.9, 'rgba(255,110,150,0.45)');
    }
    if (o.mouth === false) return;
    ctx.beginPath();
    ctx.moveTo(cx - es * 1.2, cy + es * 1.4);
    ctx.quadraticCurveTo(cx - es * 0.6, cy + es * 2.2, cx, cy + es * 1.5);
    ctx.quadraticCurveTo(cx + es * 0.6, cy + es * 2.2, cx + es * 1.2, cy + es * 1.4);
    ctx.lineWidth = Math.max(1.2, r * 0.045); ctx.strokeStyle = OUTLINE; ctx.stroke();
  }
  function drawMustache(x, y, w) {
    ctx.fillStyle = '#1d1416';
    ctx.beginPath();
    ctx.moveTo(x, y - w * 0.12);
    ctx.bezierCurveTo(x - w * 0.35, y - w * 0.35, x - w * 0.9, y - w * 0.1, x - w, y + w * 0.15);
    ctx.bezierCurveTo(x - w * 0.6, y + w * 0.05, x - w * 0.3, y + w * 0.25, x, y + w * 0.08);
    ctx.bezierCurveTo(x + w * 0.3, y + w * 0.25, x + w * 0.6, y + w * 0.05, x + w, y + w * 0.15);
    ctx.bezierCurveTo(x + w * 0.9, y - w * 0.1, x + w * 0.35, y - w * 0.35, x, y - w * 0.12);
    ctx.fill();
  }
  function drawLips(w, open) {
    const h = w * 0.55;
    ctx.fillStyle = '#d94a64'; ctx.strokeStyle = '#6e1a2a'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-w, 0);
    ctx.bezierCurveTo(-w * 0.6, -h * 1.1, -w * 0.15, -h * 0.9, 0, -h * 0.55);
    ctx.bezierCurveTo(w * 0.15, -h * 0.9, w * 0.6, -h * 1.1, w, 0);
    ctx.bezierCurveTo(w * 0.6, h * 1.2, -w * 0.6, h * 1.2, -w, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    if (open > 0.15) { ellipse(0, 0, w * 0.6, h * 0.4 * open, '#3d0b10'); return; }
    ctx.beginPath(); ctx.moveTo(-w * 0.85, 0); ctx.quadraticCurveTo(0, h * 0.25, w * 0.85, 0); ctx.stroke();
  }
  function drawShades(x, y, s) {
    ellipse(x - s * 1.05, y, s, s * 0.62, '#141014');
    ellipse(x + s * 1.05, y, s, s * 0.62, '#141014');
    line([x - s * 0.2, y - s * 0.2, x + s * 0.2, y - s * 0.2], '#141014', Math.max(1.5, s * 0.25));
    ellipse(x - s * 1.3, y - s * 0.2, s * 0.25, s * 0.14, 'rgba(255,255,255,0.6)');
  }
  function bananaPath(r) {
    ctx.beginPath();
    ctx.moveTo(-r * 0.9, -r * 0.5);
    ctx.quadraticCurveTo(0, r * 1.25, r * 0.9, -r * 0.5);
    ctx.quadraticCurveTo(0, r * 0.3, -r * 0.9, -r * 0.5);
    ctx.closePath();
  }

  // googly eyes: pupils are little weights that slosh when the owner moves
  const mkGoogly = (x, y, R) => ({ x, y, R, px: 0, py: 0, vx: 0, vy: 0 });
  function tickGoogly(e, dt) {
    for (const g of e.state.googly) {
      const max = g.R * e.r * 0.45;
      g.vx -= (e.vx - e.lvx) * 0.9; g.vy -= (e.vy - e.lvy) * 0.9;
      g.vy += 1500 * dt;
      g.vx *= 1 - Math.min(1, dt * 1.2); g.vy *= 1 - Math.min(1, dt * 1.2);
      g.px += g.vx * dt; g.py += g.vy * dt;
      const d = Math.hypot(g.px, g.py);
      if (d <= max) continue;
      const nx = g.px / d, ny = g.py / d, vn = g.vx * nx + g.vy * ny;
      g.px = nx * max; g.py = ny * max;
      if (vn > 0) { g.vx -= vn * nx * 1.6; g.vy -= vn * ny * 1.6; }
      g.vx *= 0.96; g.vy *= 0.96;
    }
  }
  function drawGoogly(e, g, oy = 0) {
    const R = g.R * e.r, X = g.x * e.r, Y = g.y * e.r + oy;
    const c = Math.cos(-e.rot), s = Math.sin(-e.rot);
    ellipse(X, Y, R, R, '#ffffff', OUTLINE, 2.5);
    ellipse(X + g.px * c - g.py * s, Y + g.px * s + g.py * c, R * 0.52, R * 0.52, '#141014');
  }

  // ---------- entity helpers ----------
  function makeEntity(kind, x, y, extra = {}) {
    const k = KINDS[kind];
    return {
      kind, x, y, vx: 0, vy: 0, lvx: 0, lvy: 0,
      r: k.r * rand(0.88, 1.12), rot: 0, vr: 0, sq: 0, sqv: 0,
      age: 0, seed: Math.random(), fade: 1,
      dying: false, dead: false, dragging: false, onFloor: false,
      state: k.init ? k.init() : {},
      ...extra,
    };
  }
  function addEntity(e) {
    game.entities.push(e);
    const alive = game.entities.filter(o => !o.dying);
    if (alive.length > MAX_ENTITIES) {
      const oldest = alive.find(o => !o.dragging);
      if (oldest) oldest.dying = true;
    }
    return e;
  }
  function replaceEntity(old, next) {
    const i = game.entities.indexOf(old);
    if (i < 0) return;
    next.vx = old.vx; next.vy = old.vy; next.dragging = old.dragging;
    game.entities[i] = next;
    for (const d of drags.values()) if (d.e === old) d.e = next;
  }
  function fling(e, speed) {
    const a = rand(0, TAU);
    e.vx += Math.cos(a) * speed; e.vy += Math.sin(a) * speed - speed * 0.3;
  }

  // ---------- entity physics ----------
  function collideWalls(e, k) {
    const m = e.r * 0.8, b = k.bounce ?? 0.5;
    if (e.x < m) { e.x = m; e.vx = Math.abs(e.vx) * b; }
    if (e.x > W - m) { e.x = W - m; e.vx = -Math.abs(e.vx) * b; }
    if (e.y < m) { e.y = m; e.vy = Math.abs(e.vy) * b; }
    const floor = H - e.r * (k.foot ?? 0.85);
    e.onFloor = false;
    if (e.y <= floor) return;
    e.y = floor;
    if (e.vy > 120) e.sqv += Math.min(6, e.vy / 160);
    e.vy = -Math.abs(e.vy) * b;
    if (Math.abs(e.vy) < 40) { e.vy = 0; e.onFloor = true; }
    e.vx *= 0.92;
  }
  function pushFromButton(e) {
    const dx = e.x - button.x, dy = e.y - button.y;
    const d = Math.hypot(dx, dy), min = button.r + e.r * 0.6;
    if (d < 0.01 || d >= min) return;
    const f = (min - d) / d;
    e.x += dx * f * 0.3; e.y += dy * f * 0.3; e.vx += dx * f * 4; e.vy += dy * f * 4;
  }
  function stepEntity(e, dt) {
    const k = KINDS[e.kind];
    e.age += dt;
    if (!e.dragging) {
      if (k.gravity) e.vy += k.gravity * dt;
      if (k.wander) {
        e.vx += Math.sin(game.time * 0.7 + e.seed * 40) * k.wander * dt * 3;
        e.vy += Math.cos(game.time * 0.9 + e.seed * 70) * k.wander * dt * 3;
      }
      const drag = 1 - Math.min(1, (k.drag ?? 1) * dt);
      e.vx *= drag;
      if (!k.gravity) e.vy *= drag;
      e.x += e.vx * dt; e.y += e.vy * dt;
      e.rot += e.vr * dt; e.vr *= 1 - Math.min(1, dt * 2);
      if (k.upright) e.rot = lerpAngle(e.rot, 0, dt * 5);
      collideWalls(e, k);
      if (!game.finale) pushFromButton(e);
    }
    e.sqv += (-170 * e.sq - 9 * e.sqv) * dt;
    e.sq = clamp(e.sq + e.sqv * dt, -0.35, 0.35);
    if (k.update) k.update(e, dt);
    e.lvx = e.vx; e.lvy = e.vy;
    if (e.dying) { e.fade -= dt * 2.5; if (e.fade <= 0) e.dead = true; }
  }
  function drawEntity(e) {
    const grow = e.age < 0.3 ? easeOutBack(e.age / 0.3) : 1;
    let sc = grow * (1 + game.inflate) * (e.dying ? Math.max(0.01, e.fade) : 1);
    if (game.era === 3 || game.finale) sc *= 1 + game.bop * 0.08;
    ctx.save();
    ctx.globalAlpha = clamp(e.fade, 0, 1);
    ctx.translate(e.x, e.y);
    ctx.rotate(e.rot);
    ctx.scale(sc * (1 + e.sq), sc * (1 - e.sq));
    if (game.era === 2 && !game.transition) ctx.transform(1, 0, Math.sin(game.time * 1.7 + e.seed * 9) * 0.12 * (0.4 + eraT()), 1, 0, 0);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    KINDS[e.kind].draw(e);
    ctx.restore();
  }

  // ---------- particles ----------
  const PTYPES = {
    drop: { g: 500, color: '#141014' }, heart: { g: -40 }, star: { g: 300 }, sparkle: { g: 0 },
    shell: { g: 1000, bounce: 0.4 }, feather: { g: 50, flutter: true }, tooth: { g: 1100, bounce: 0.45 },
    confetti: { g: 220, flutter: true }, cloud: { g: -30 }, ball: { g: 1100, bounce: 0.75 },
    smoke: { g: -50 }, shades: { g: 1000, bounce: 0.3 }, ring: { g: 0 }, eyelet: { g: 0 },
  };
  function spawnParticle(type, x, y, o = {}) {
    if (game.particles.length >= MAX_PARTICLES) game.particles.shift();
    game.particles.push({
      type, x, y,
      vx: o.vx ?? rand(-140, 140), vy: o.vy ?? rand(-280, -80),
      age: 0, life: o.life ?? rand(0.9, 1.6), size: o.size ?? rand(5, 10),
      rot: rand(0, TAU), vr: rand(-6, 6), seed: Math.random(),
      color: o.color ?? PTYPES[type].color ?? pick(CONFETTI),
    });
  }
  function stepParticles(dt) {
    for (const p of game.particles) {
      const t = PTYPES[p.type];
      p.age += dt; p.vy += t.g * dt;
      p.vx *= 1 - Math.min(1, dt * 0.8);
      if (t.flutter) { p.vy *= 1 - Math.min(1, dt * 1.5); p.vx += Math.sin(game.time * 4 + p.seed * 20) * 60 * dt; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (t.bounce && p.y > H - p.size) { p.y = H - p.size; p.vy = -Math.abs(p.vy) * t.bounce; p.vx *= 0.8; }
    }
    game.particles = game.particles.filter(p => p.age < p.life && p.y < H + 60);
  }
  function heartPath(s) {
    ctx.beginPath(); ctx.moveTo(0, s * 0.35);
    ctx.bezierCurveTo(-s * 1.1, -s * 0.35, -s * 0.45, -s * 1.15, 0, -s * 0.45);
    ctx.bezierCurveTo(s * 0.45, -s * 1.15, s * 1.1, -s * 0.35, 0, s * 0.35);
  }
  function starPath(s) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? s * 0.45 : s;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
  }
  function sparklePath(s) {
    ctx.beginPath(); ctx.moveTo(0, -s);
    ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s);
    ctx.quadraticCurveTo(0, 0, -s, 0); ctx.quadraticCurveTo(0, 0, 0, -s);
  }
  function drawParticle(p) {
    const k = p.age / p.life, s = p.size;
    ctx.save();
    ctx.globalAlpha = p.type === 'eyelet' ? 1 : clamp(1 - k * k, 0, 1);
    ctx.translate(p.x, p.y);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    switch (p.type) {
      case 'drop':
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.moveTo(0, -s);
        ctx.bezierCurveTo(s * 0.8, 0, s * 0.6, s * 0.8, 0, s * 0.8);
        ctx.bezierCurveTo(-s * 0.6, s * 0.8, -s * 0.8, 0, 0, -s); ctx.fill();
        break;
      case 'heart': ctx.rotate(Math.sin(p.rot) * 0.3); heartPath(s); ctx.fillStyle = '#ff6b9a'; ctx.fill(); break;
      case 'star': ctx.rotate(p.rot); starPath(s); ctx.fillStyle = '#ffd23f'; ctx.fill(); break;
      case 'sparkle': {
        const sc = Math.max(0.01, Math.sin(k * Math.PI));
        ctx.scale(sc, sc); sparklePath(s * 1.3); ctx.fillStyle = p.color; ctx.fill();
        break;
      }
      case 'shell':
        ctx.rotate(p.rot); ctx.beginPath(); ctx.moveTo(-s, s * 0.5); ctx.lineTo(-s * 0.3, -s * 0.6); ctx.lineTo(0, -s * 0.1); ctx.lineTo(s * 0.4, -s * 0.7); ctx.lineTo(s, s * 0.5); ctx.closePath();
        ctx.fillStyle = '#fff8ea'; ctx.fill(); ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.5; ctx.stroke();
        break;
      case 'feather':
        ctx.rotate(Math.sin(game.time * 3 + p.seed * 9) * 0.8);
        ellipse(0, 0, s * 0.4, s, p.color, OUTLINE, 1);
        line([0, -s, 0, s], OUTLINE, 0.8);
        break;
      case 'tooth':
        ctx.rotate(p.rot);
        for (const side of [-1, 1]) ellipse(side * s * 0.28, s * 0.35, s * 0.2, s * 0.4, '#f1e7d2', OUTLINE, 1.2);

        break;

  // ---------- the button ----------
  function buttonColors(era, t) {
    if (era === 0) return { base: mixHex('#f1f1f3', '#a8343a', t * t * 0.85), rim: mixHex('#c9c9cf', '#5e1418', t * t * 0.85), hi: 'rgba(255,255,255,0.75)' };
    if (era === 1) return { base: '#ff9ec4', rim: '#e0709b', hi: 'rgba(255,255,255,0.7)' };
    if (era === 2) return { base: '#e2a594', rim: '#a8665a', hi: 'rgba(255,240,230,0.5)' };

  }
  function drawCracks(r, y, k) {
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, y, r, r * 0.94, 0, 0, TAU); ctx.clip();
    for (const a of [2.4, 0.4, -1.2]) {
      let x = r * 0.1, yy = y - r * 0.2;
      const pts = [x, yy];
      for (let i = 1; i <= 4; i++) {
        const turn = a + (i % 2 ? 0.5 : -0.5), len = r * 0.22 * k;

    ctx.restore();
    if (k <= 0.5) return;

    ctx.fillStyle = '#5e1418';
    ctx.beginPath(); ctx.moveTo(r * 0.25, r * 0.95); ctx.quadraticCurveTo(r * 0.3, r * 0.95 + dl, r * 0.35, r * 0.95); ctx.fill();

  }
  function drawFleshButton(r, y) {
    ctx.strokeStyle = 'rgba(150,40,50,0.45)'; ctx.lineWidth = 1.4;
    for (let i = 0; i < 6; i++) {
      const a = i * 1.05 + 0.3;

      ctx.moveTo(Math.cos(a) * r * 0.92, y + Math.sin(a) * r * 0.86);
      ctx.quadraticCurveTo(Math.cos(a + 0.4) * r * 0.7, y + Math.sin(a + 0.4) * r * 0.65, Math.cos(a) * r * 0.5, y + Math.sin(a) * r * 0.48);

  }
  function drawButton() {
    const b = button, r = b.r, era = game.era, col = buttonColors(era, eraT());
    const idle = game.started ? 0 : Math.sin(game.time * 2.2) * 0.03;
    const pulse = era === 2 ? Math.sin(game.time * 4.5) * 0.04 : 0;
    const bop = era === 3 || game.finale ? game.bop * 0.07 : 0;

    ellipse(0, -lift, r, r * 0.94, col.base, OUTLINE, 3);

  function updateButton(dt) {

  // ---------- eras ----------
  const spawnKind = () => pick(SPAWN_STAGES[game.era][Math.min(2, Math.floor(eraT() * 3))]);
  const TRANSITION_FX = [
    {
      particle: 'sparkle',
      start: () => { sfx.stinger(0.2); audio.tone(55, 1.4, { type: 'sawtooth', lp: 300, vol: 0.25 }); },
      convert: () => [523, 659, 784, 1047].forEach((f, i) => audio.tone(f, 0.5, { delay: i * 0.07, vol: 0.12, type: 'triangle' })),
    },
    {
      particle: 'drop',
      start: () => { for (let i = 0; i < 6; i++) audio.tone(70, 0.3, { to: 40, vol: 0.3, delay: i * 0.3 }); },
      convert: () => sfx.squelch(),

    {
      particle: 'confetti',
      start: () => sfx.slideUp(),

  // ---------- ambience ----------
  function maybePeek() {
    game.peek = { side: Math.random() < 0.5 ? -1 : 1, y: rand(H * 0.15, H * 0.7), t: 0, dur: rand(1.2, 2.2) };
  }
  function tickBeat(dt, loud) {
    game.beatTimer -= dt;

    game.beatTimer = Math.max(game.beatTimer + 60 / BPM, 0.05);
    const n = game.beatCount++;
    game.bop = 1;
    if (!loud) return;
    sfx.kick();
    sfx.bass([98, 98, 147, 131][Math.floor(n / 2) % 4] * (n % 2 ? 2 : 1));

  // ---------- overlays ----------
  function fillScreen(style) { ctx.fillStyle = style; ctx.fillRect(0, 0, W, H); }
  function drawBackground() {

  }
  function drawVignette() {

  }
  function drawPeek() {
    const pk = game.peek;
    if (!pk) return;
    const out = Math.sin((pk.t / pk.dur) * Math.PI), x = pk.side < 0 ? -40 + out * 34 : W + 40 - out * 34;
    ellipse(x, pk.y, 40, 48, `rgba(12,10,11,${out})`);
    const ex = x - pk.side * 18;
    for (const side of [-1, 1]) ellipse(ex + side * 8, pk.y - 6, 4, 2.5, `rgba(255,255,255,${out})`);
  }
  function drawDarkness() {

    fillScreen(REDUCED ? 'rgba(0,0,0,0.35)' : 'rgba(0,0,0,0.94)');
    for (const side of [-1, 1]) {
      ellipse(game.flickPos.x + side * 11, game.flickPos.y, 6, 3.2, '#f6f2ee');
      ellipse(game.flickPos.x + side * 11, game.flickPos.y, 1.6, 1.6, '#b3121c');

  }
  function drawTransitionOverlay() {
    const tr = game.transition;
    if (!tr) return;
    const spec = TRANSITIONS[tr.from], p = tr.t / spec.dur, c = spec.convertAt;
    const flashOut = () => fillScreen(`rgba(255,255,255,${clamp(1 - (p - c) / (1 - c), 0, 1)})`);
    if (tr.from === 0) {
      if (p >= c) { flashOut(); return; }
      fillScreen(`rgba(8,6,8,${easeOut(Math.min(1, p / 0.4))})`);
      for (const eye of tr.eyes) {
        const local = (p - 0.2 - eye.d) / 0.3;

  // ---------- input ----------
  function hitEntity(x, y) {

  function pressButton() {

  }
  function onMove(ev) {

  // shaking the phone itself, where the browser allows motion access

  function shakeAll() {

  // ---------- loop ----------

  function render() {

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    game.time += dt;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function start(saved) {
    if (saved && Number.isInteger(saved.era) && saved.era >= 0 && saved.era < 4) {
      game.era = saved.era;
      game.progress = clamp(Number(saved.progress) || 0, 0, ERA_LENGTH - 1);
      game.started = game.era > 0 || game.progress > 0;
    }
    game.bg = [...BG[game.era]];
    resize();
    window.addEventListener('resize', resize);
    canvas.addEventListener('pointerdown', onDown, { passive: false });
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    canvas.addEventListener('contextmenu', ev => ev.preventDefault());
    document.addEventListener('touchmove', ev => ev.preventDefault(), { passive: false });
    document.addEventListener('gesturestart', ev => ev.preventDefault());
    document.addEventListener('dblclick', ev => ev.preventDefault());
    document.addEventListener('visibilitychange', () => {
      if (!audio.ctx) return;
      const change = document.hidden ? audio.ctx.suspend() : audio.ctx.resume();
      change.catch(() => { /* the next touch resumes sound */ });
    });
    requestAnimationFrame(t => { last = t; frame(t); });
  }

  const hot = window.claude?.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ era: game.era, progress: game.progress }));
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start(hot?.data ?? {});
})();
</script>
</body>
</html>
